<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THI THĂNG ĐAI MÔN PHÁI VÕ ĐƯỜNG TRÍ VŨ - 07-06-2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            /* Background thiên nhiên từ Unsplash */
            background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2560&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        .gallery-container {
            /* Hiệu ứng kính mờ nổi bật trên nền thiên nhiên */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 90vw;
            width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .image-wrapper {
            height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        #gallery-img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            object-fit: contain;
            transition: opacity 0.3s ease-in-out;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        button {
            background: rgba(46, 204, 113, 0.9);
            border: 2px solid #2ecc71;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #27ae60;
            border-color: #27ae60;
            transform: scale(1.05);
        }

        button:disabled {
            background: rgba(85, 85, 85, 0.7);
            border-color: transparent;
            color: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        #counter {
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 2px;
            min-width: 80px;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <div class="image-wrapper">
            <img id="gallery-img" src="" alt="Đang tải ảnh...">
        </div>
        
        <div class="controls">
            <button id="btn-prev">◀ Trước</button>
            <div id="counter">0 / 0</div>
            <button id="btn-next">Tiếp ▶</button>
        </div>
    </div>

    <!-- Tải danh sách ảnh được tạo tự động từ Python -->
    <script src="image_data.js"></script>
    
    <script>
        let currentIndex = 0;
        const imgElement = document.getElementById('gallery-img');
        const counterElement = document.getElementById('counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function updateGallery() {
            // Xử lý trường hợp mảng ảnh trống hoặc file JS lỗi
            if (typeof imageList === 'undefined' || imageList.length === 0) {
                imgElement.alt = "Không tìm thấy ảnh nào trong thư mục!";
                return;
            }
            
            // Hiệu ứng mờ dần (Fade-in) khi chuyển ảnh
            imgElement.style.opacity = 0;
            setTimeout(() => {
                // Ráp tên thư mục 'images/' vào trước tên file
                imgElement.src = 'images/' + imageList[currentIndex];
                imgElement.style.opacity = 1;
            }, 150);

            // Cập nhật số thứ tự
            counterElement.innerText = `${currentIndex + 1} / ${imageList.length}`;
            
            // Vô hiệu hóa nút bấm nếu ở đầu hoặc cuối danh sách
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === imageList.length - 1;
        }

        // Bắt sự kiện click cho nút Trước
        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateGallery();
            }
        });

        // Bắt sự kiện click cho nút Tiếp
        btnNext.addEventListener('click', () => {
            if (currentIndex < imageList.length - 1) {
                currentIndex++;
                updateGallery();
            }
        });

        // Tải ảnh đầu tiên khi mở trang
        window.onload = updateGallery;
    </script>
</body>
</html>
